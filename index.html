<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="style.css">
	<link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
	<div class="container">
		<div class="display-container">
			<input id="fnd" type="text" placeholder="0">
		</div>
		<div class="btn-container">
			<button value="c" class="clr-btn">C</button>
			<button value="(" class="br-btn">(</button>
			<button value=")" class="br-btn">)</button>
			<button value="<" class="op-btn"><-</button>
			<button value="7">7</button>
			<button value="8">8</button>
			<button value="9">9</button>
			<button value="/" class="op-btn">÷</button>
			<button value="4">4</button>
			<button value="5">5</button>
			<button value="6">6</button>
			<button value="*" class="op-btn">X</button>
			<button value="1">1</button>
			<button value="2">2</button>
			<button value="3">3</button>
			<button value="-" class="op-btn">-</button>
			<button value="0">0</button>
			<button value="." class="op-btn">.</button>
			<button value="ans" class="op-btn">Ans</button>
			<button value="+" class="op-btn">+</button>
			<button value="=" class="equal-btn">=</button>
		</div>
	</div>
<script src="script.js">	</script>
</body>
</html>
